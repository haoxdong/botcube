[project]
name = "botcube-credential-service"
version = "0.1.0"
description = "BotCube's Credential Service: the one process that can decrypt Durable Credentials, with provider plug-ins."
requires-python = ">=3.11"
dependencies = [
  "botcube-credential-source",
  "boto3>=1.43.108",
  "cryptography>=49.0.0",
  "certifi>=2026.7.22",
  "websockets>=16.0",
  "fastapi>=0.142.2",
  "httpcore>=1.0.9",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.15.1",
  "uvicorn>=0.54.0",
  "awslambdaric>=4.2.3",
  "jsonschema>=4.26.0",
  "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
botcube-openai-plan-usage = "botcube_credential_service.openai_sign_in:main"

[dependency-groups]
dev = [
  "moto[dynamodb,kms,logs,secretsmanager]>=5.2.3",
  "ty==0.0.99",
  "pytest>=9.1.1",
  "types-boto3[dynamodb,kms,logs,secretsmanager]>=1.43.108",
]

[tool.ty.environment]
python-version = "3.11"

[tool.uv.sources]
botcube-credential-source = { path = "../credential-source" }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
  "integration: runs a real subprocess, server or socket (ADR 0083 decision 1)",
  "ci_host: needs a system package or kernel feature CI's runners have and cloud agent containers lack; check:pr deselects it",
]
