[project]
name = "botcube-template"
version = "0.1.0"
description = "Neutral template Cartridge for BotCube."
requires-python = ">=3.11"
dependencies = [
    "botcube-credential-service",
    "uvicorn>=0.34",
]

[project.scripts]
template-site = "botcube_template.fake_site:main"
template-cli = "botcube_template.fake_cli:main"

[project.entry-points."botcube.cartridge"]
template = "botcube_template.harness:CARTRIDGE"

[dependency-groups]
dev = [
  "botcube-harness-deepagents",
  "moto[dynamodb,kms]>=5",
  "mutmut==3.8.0",
  "pyright==1.1.414",
  "pytest>=9.1.1",
]

[tool.uv.sources]
botcube-harness-deepagents = { path = "../harness/deepagents", editable = true }
botcube-credential-service = { path = "../credential-service", editable = true }

[tool.pyright]
# Check against the oldest supported Python, which Presubmit runs.
pythonVersion = "3.11"
# Every parameter carries a type annotation.
reportMissingParameterType = "error"
# Generic types carry their type arguments, and no parameter type is unknown.
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
