[project]
name = "botcube-infra"
version = "0.1.0"
description = "BotCube's deploy scripts and their tests."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43.108",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5.2.3",
  "ty==0.0.99",
  "pytest>=9.1.1",
  "types-boto3[acm,bedrock-agentcore,bedrock-agentcore-control,cloudformation,cloudwatch,dynamodb,ec2,ecr,ecs,elbv2,lambda,logs,route53,s3,sns]>=1.43.108",
]

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["ecs", "ecs/origin-provider", "ecs/credential-audit-copy"]

[tool.ty.src]
include = ["ecs", "tests"]
exclude = ["ecs/cdk", "**/node_modules", "**/__pycache__"]

[tool.pytest.ini_options]
markers = ["integration: runs a real subprocess, server or socket (ADR 0083 decision 1)"]
# The deploy scripts import their shared identity module from their own directory.
pythonpath = ["ecs", "ecs/credential-audit-copy"]
