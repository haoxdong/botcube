services:
  config-resolve:
    build:
      context: ../..
      dockerfile: chat/Dockerfile
      target: build
      args:
        REGISTRY: ${BOTCUBE_LOCAL_REGISTRY:-public.ecr.aws}
        BOTCUBE_ROOT: .
    command: ["sh", "-ec", "node config/cli.ts resolve /source/botcube.yaml > /resolved/botcube.tmp && mv /resolved/botcube.tmp /resolved/botcube.json"]
    volumes:
      - ./deployment/botcube.yaml:/source/botcube.yaml:ro
      - resolved-config:/resolved

  dynamodb:
    image: ${BOTCUBE_LOCAL_DYNAMODB_IMAGE:-amazon/dynamodb-local:3.3.0}
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodb-state:/data

  # The Harness image carries Python and boto3 for this one-off script.
  chat-table-init:
    build:
      context: ../..
      dockerfile: harness/deepagents/Dockerfile
      target: harness
      args: &registry-build-args
        REGISTRY: ${BOTCUBE_LOCAL_REGISTRY:-public.ecr.aws}
    depends_on:
      - dynamodb
    environment: &dynamodb-environment
      NO_PROXY: ${NO_PROXY:-},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      no_proxy: ${no_proxy:-${NO_PROXY:-}},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      BOTCUBE_CHAT_TABLE: ${BOTCUBE_CHAT_TABLE:-chat}
    volumes:
      - ./init-chat-table.py:/init-chat-table.py:ro
    command: ["/opt/harness/.venv/bin/python", "/init-chat-table.py"]

  vault-table-init:
    build:
      context: ../..
      dockerfile: infra/local/credential-service.Dockerfile
      args: *registry-build-args
    depends_on:
      - dynamodb
    environment:
      <<: *dynamodb-environment
      BOTCUBE_VAULT_TABLE: credential-vault
    volumes:
      - ./init-vault-table.py:/init-vault-table.py:ro
    command: ["python", "/init-vault-table.py"]

  fake-site:
    build:
      context: ../..
      dockerfile: infra/local/credential-service.Dockerfile
      args: *registry-build-args
    # The fake site the Credential Service signs in to; it also answers the Chat Service's Bedrock calls.
    command: ["python", "/opt/stand-ins/fake_site.py"]
    environment:
      PORT: "8124"
      FAKE_SITE_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8124/login')"]
      interval: 2s
      timeout: 2s
      retries: 30

  credential-service:
    build:
      context: ../..
      dockerfile: infra/local/credential-service.Dockerfile
      args: *registry-build-args
    depends_on:
      config-resolve:
        condition: service_completed_successfully
      fake-site:
        condition: service_healthy
      vault-table-init:
        condition: service_completed_successfully
    environment:
      <<: *dynamodb-environment
      PORT: "8125"
      BOTCUBE_VAULT_TABLE: credential-vault
      BOTCUBE_LOCAL_VAULT_KEY_FILE: /var/lib/local-vault/key
      BOTCUBE_CREDENTIAL_INVOCATION_SECRET: local-invocation-secret
      BOTCUBE_CONFIG: /resolved/botcube.json
      FAKE_SITE_URL: http://fake-site:8124
    volumes:
      - resolved-config:/resolved:ro
      - credential-key:/var/lib/local-vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8125/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The example bot's image, built FROM the same Harness image as chat-table-init.
  harness:
    build:
      context: ../..
      dockerfile: examples/bot/Dockerfile
      additional_contexts:
        harness: service:chat-table-init
    depends_on:
      config-resolve:
        condition: service_completed_successfully
    environment:
      NO_PROXY: ${NO_PROXY:-},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      no_proxy: ${no_proxy:-${NO_PROXY:-}},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      BOTCUBE_CHECKPOINT_PATH: ${BOTCUBE_CHECKPOINT_PATH:-/var/lib/botcube-harness/checkpoints.sqlite3}
      BOTCUBE_CONFIG: /resolved/botcube.json
    volumes:
      - resolved-config:/resolved:ro
      - harness-state:/var/lib/botcube-harness
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The session API reads Sessions from the Harness's checkpoints (ADR 0067).
  session-api:
    build:
      context: ../..
      dockerfile: harness/deepagents/session-api.Dockerfile
      args: *registry-build-args
    entrypoint: ["python", "-m", "botcube_harness_deepagents.session_api"]
    command: []
    environment:
      NO_PROXY: ${NO_PROXY:-},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      no_proxy: ${no_proxy:-${NO_PROXY:-}},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      PORT: "8081"
      BOTCUBE_CHECKPOINT_PATH: ${BOTCUBE_CHECKPOINT_PATH:-/var/lib/botcube-harness/checkpoints.sqlite3}
    volumes:
      - harness-state:/var/lib/botcube-harness
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/ping')"]
      interval: 2s
      timeout: 2s
      retries: 30

  chat-service:
    build:
      context: ../..
      dockerfile: chat/Dockerfile
      args:
        REGISTRY: ${BOTCUBE_LOCAL_REGISTRY:-public.ecr.aws}
        BOTCUBE_ROOT: .
    depends_on:
      config-resolve:
        condition: service_completed_successfully
      harness:
        condition: service_healthy
      session-api:
        condition: service_healthy
      chat-table-init:
        condition: service_completed_successfully
      credential-service:
        condition: service_healthy
    environment:
      <<: *dynamodb-environment
      BOTCUBE_LOCAL_HARNESS_URL: http://harness:8080
      BOTCUBE_LOCAL_SESSION_API_URL: http://session-api:8081
      BOTCUBE_CREDENTIAL_SERVICE_URL: http://credential-service:8125
      BOTCUBE_CREDENTIAL_INVOCATION_SECRET: local-invocation-secret
      BOTCUBE_AGENT_COMPUTER_CDP_URL: ws://chat-service:8123/agent-computer/cdp
      BOTCUBE_CONFIG: /resolved/botcube.json
    volumes:
      - resolved-config:/resolved:ro
    ports:
      - "${BOTCUBE_LOCAL_CHAT_PORT:-8123}:8123"

  ui:
    build:
      context: ../..
      dockerfile: ui/web/Dockerfile
      target: dev
      args:
        REGISTRY: ${BOTCUBE_LOCAL_REGISTRY:-public.ecr.aws}
    environment:
      NO_PROXY: ${NO_PROXY:-},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      no_proxy: ${no_proxy:-${NO_PROXY:-}},dynamodb,harness,session-api,chat-service,localhost,127.0.0.1
      NEXT_PUBLIC_CHAT_SERVICE_URL: ${NEXT_PUBLIC_CHAT_SERVICE_URL:-http://localhost:${BOTCUBE_LOCAL_CHAT_PORT:-8123}}
    depends_on:
      - chat-service
    ports:
      - "${BOTCUBE_LOCAL_UI_PORT:-3001}:3001"

volumes:
  resolved-config:
  dynamodb-state:
  harness-state:
  credential-key:
