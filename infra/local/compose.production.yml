# Exercise deployable images with the local neutral infrastructure. The Credential Service and fake site stay the
# local stand-ins (credential-service.Dockerfile): the stock Credential Service serves no fake site.
services:
  chat-table-init:
    image: botcube-production-harness
  chat-service:
    image: botcube-production-chat
  harness:
    image: botcube-production-example-bot
    environment:
      OTEL_TRACES_EXPORTER: console
  session-api:
    image: botcube-production-session-api
  ui:
    image: botcube-production-ui
    build:
      target: runtime
      args:
        NEXT_PUBLIC_CHAT_SERVICE_URL: ${NEXT_PUBLIC_CHAT_SERVICE_URL:-http://localhost:${BOTCUBE_LOCAL_CHAT_PORT:-8123}}
