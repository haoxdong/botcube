[project]
name = "botcube-cartridge"
version = "0.1.0"
description = "Framework-neutral Cartridge contracts for BotCube."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pyright==1.1.414", "pytest>=9.1.1"]

[tool.ty.environment]
python-version = "3.11"

[tool.pyright]
pythonVersion = "3.11"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["integration: runs a real subprocess, server or socket (ADR 0083 decision 1)"]
