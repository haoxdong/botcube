[project]
name = "botcube-endpoint-tls"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anyio>=4", "botcube-credential-source", "cryptography>=48.0.1", "httpcore>=1.0.9", "pydantic>=2"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.uv.sources]
botcube-credential-source = { path = "../credential-source" }
