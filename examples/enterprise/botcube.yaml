{
  "$schema": "../../config/botcube.schema.json",
  "name": "bot-cube",
  "env": {
    "account": "000000000000",
    "region": "us-east-1"
  },
  "names": {
    "agentComputerBrowserProfileNamePrefix": "template_",
    "linkBrowserName": "bot_cube_provider_link",
    "agentCoreTargetName": "template",
    "chatServiceTaskRoleName": "bot-cube-chat-service",
    "filesMountRoleName": "bot-cube-files-mount",
    "filesLinksRoleName": "bot-cube-files-links",
    "agentComputerBrowserRoleName": "bot-cube-agent-computer-browser"
  },
  "domains": {
    "web": "http://localhost:3001",
    "webAliases": [
      "http://127.0.0.1:3001"
    ],
    "chatService": "http://localhost:8123",
    "chatServicePreview": "https://api-preview.example.invalid"
  },
  "agentCore": {
    "runtime": {
      "platformVersion": "V2",
      "containerUri": "123456789012.dkr.ecr.us-east-1.amazonaws.com/bot-cube/runtime:release"
    },
    "browsers": {
      "link": {
        "extension": {
          "bucket": "example-browser-assets",
          "key": "bot-cube/browser-extensions/provider-user-agent/v2.zip",
          "versionId": "placeholder"
        }
      }
    }
  },
  "cloudflare": {
    "zone": "example.invalid",
    "originPull": {
      "caCertificate": {
        "bucket": "example-origin-trust",
        "key": "origin-pull-ca.pem"
      }
    }
  },
  "schedules": {
    "kind": "table-poller"
  },
  "integrations": {
    "signIn": {
      "kind": "oidc",
      "issuer": "https://login.example.com",
      "clients": [
        {
          "clientId": "botcube",
          "clientSecret": {
            "kind": "secret",
            "secretId": "arn:aws:secretsmanager:us-east-1:123456789012:secret:botcube/oidc-client-secret"
          }
        }
      ]
    },
    "modelGateway": {
      "kind": "openai-compatible",
      "url": "https://models.example.com/v1",
      "credential": {
        "kind": "file",
        "path": "/run/secrets/botcube/models-api-key"
      },
      "headers": {
        "x-tenant": "botcube-example"
      },
      "proxy": "integrations.proxy",
      "turnSummaryModel": "openai:example-summary"
    },
    "harnessAuth": {
      "kind": "jwt-bearer",
      "issuer": "botcube",
      "clients": [
        {
          "clientId": "botcube-harness"
        }
      ]
    },
    "awsAccess": {
      "kind": "assume-role"
    },
    "telemetry": {
      "kind": "otlp",
      "url": "http://otel-collector.example.com:4318/v1/traces",
      "credential": {
        "kind": "file",
        "path": "/run/secrets/botcube/telemetry-token"
      },
      "headers": {
        "x-tenant": "botcube-example"
      },
      "proxy": "integrations.proxy"
    },
    "imageRegistry": {
      "url": "https://mirror.example.com/ecr-public"
    },
    "relayProviders": {
      "openai": {
        "proxy": "integrations.proxy"
      }
    },
    "proxy": {
      "kind": "forward",
      "url": "http://proxy.example.com:3128",
      "credential": {
        "kind": "file",
        "path": "/run/secrets/botcube/proxy-token"
      },
      "headers": {
        "x-egress-route": "botcube-example"
      }
    }
  },
  "network": {
    "openEgress": {
      "proxy": "integrations.proxy"
    }
  },
  "existing": {
    "vpc": {
      "vpcId": "vpc-fixtureenterprise",
      "publicSubnets": [
        {
          "subnetId": "subnet-fixturepublica",
          "availabilityZone": "us-east-1a"
        },
        {
          "subnetId": "subnet-fixturepublicb",
          "availabilityZone": "us-east-1b"
        }
      ],
      "privateSubnets": [
        {
          "subnetId": "subnet-fixtureprivatea",
          "availabilityZone": "us-east-1a",
          "ipv4CidrBlock": "198.51.100.0/24"
        },
        {
          "subnetId": "subnet-fixtureprivateb",
          "availabilityZone": "us-east-1b",
          "ipv4CidrBlock": "203.0.113.0/24"
        }
      ]
    },
    "browsers": {
      "link": {
        "browserId": "browser-placeholder",
        "securityGroupId": "sg-placeholder"
      }
    },
    "kmsKeys": {
      "vault": "arn:aws:kms:us-east-1:000000000000:key/11111111-aaaa-4aaa-8aaa-111111111111",
      "sheet": "arn:aws:kms:us-east-1:000000000000:alias/corp-botcube-sign-in-sheet",
      "memory": "arn:aws:kms:us-east-1:000000000000:key/33333333-cccc-4ccc-8ccc-333333333333",
      "images": "arn:aws:kms:us-east-1:000000000000:key/44444444-dddd-4ddd-8ddd-444444444444",
      "functions": "arn:aws:kms:us-east-1:000000000000:key/55555555-eeee-4eee-8eee-555555555555"
    },
    "tables": {
      "chat": {
        "tableName": "corp-botcube-chat",
        "streamArn": "arn:aws:dynamodb:us-east-1:000000000000:table/corp-botcube-chat/stream/2026-01-01T00:00:00.000"
      },
      "vault": {
        "tableName": "corp-botcube-vault"
      }
    },
    "buckets": {
      "connectionLogs": "corp-botcube-connection-logs",
      "slots": {
        "bucketName": "bot-cube-sessions"
      }
    },
    "files": {
      "fileSystemId": "fs-0fea7e5f11e5",
      "kmsKey": "arn:aws:kms:us-east-1:000000000000:key/66666666-ffff-4fff-8fff-666666666666",
      "accountsAccessPointId": "fsap-0acc0047",
      "accessPoints": [
        {
          "accessPointId": "fsap-0a1",
          "rootDirectory": "/accounts/00000000000000000000000000000001"
        },
        {
          "accessPointId": "fsap-0a2",
          "rootDirectory": "/accounts/00000000000000000000000000000002"
        }
      ]
    },
    "credentialService": {
      "url": "http://credentials.example.com",
      "targetGroupArn": "arn:aws:elasticloadbalancing:us-east-1:000000000000:targetgroup/corp-botcube-credentials/0123456789abcdef",
      "securityGroupId": "sg-fixturecredentials"
    }
  },
  "parking": {
    "automationUserAgents": [
      "collective-automation"
    ]
  },
  "services": {
    "chatService": {
      "image": "123456789012.dkr.ecr.us-east-1.amazonaws.com/bot-cube/chat:release"
    },
    "credentialService": {
      "image": "123456789012.dkr.ecr.us-east-1.amazonaws.com/bot-cube/credential:release"
    }
  }
}
