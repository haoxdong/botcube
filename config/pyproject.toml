[project]
name = "botcube-config"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.108"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcube_config"]

[tool.hatch.build.targets.wheel.force-include]
"bot.schema.json" = "botcube_config/bot.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src/botcube_config", "bot.schema.json"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "bot.schema.json" },
  { file = "src/botcube_config/**/*.py" },
  { file = "src/botcube_config/**/*.json" },
]
