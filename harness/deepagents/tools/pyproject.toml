[project]
name = "botcube-python-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.0.6",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "pyarrow==25.0.1",
  "openpyxl==3.1.5",
  "xlsxwriter==3.2.9",
  "xlrd==2.0.2",
  "pillow==12.3.0",
  "python-pptx==1.0.2",
  "python-docx==1.2.0",
  "pypdf==6.19.0",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "pdf2image==1.17.0",
  "reportlab==5.0.1",
  "img2pdf==0.6.3",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "tqdm==4.70.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.5",
  "tzdata==2026.5",
  "joblib==1.6.0",
  "requests==2.34.2",
]

[dependency-groups]
dev = ["pyright==1.1.414", "pytest==9.1.1"]

[tool.pyright]
pythonVersion = "3.11"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"
include = ["smoke.py", "tests"]
