[project]
name = "botcube-python-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.1.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "plotly==7.1.0",
  "pyarrow==25.0.1",
  "openpyxl==3.1.5",
  "xlsxwriter==3.3.1",
  "xlrd==2.0.2",
  "pillow==13.0.0",
  "python-pptx==1.0.2",
  "python-docx==1.2.0",
  "pypdf==6.21.4",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "pdf2image==1.17.0",
  "reportlab==5.1.0",
  "img2pdf==0.6.3",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "tqdm==4.70.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.6",
  "tzdata==2026.6",
  "joblib==1.6.0",
  "requests==2.34.2",
]

[dependency-groups]
dev = ["ty==0.0.99", "pytest==9.2.0"]

[tool.pytest.ini_options]
markers = [
  "integration: runs a real subprocess, server or socket (ADR 0083 decision 1)",
  "ci_host: needs a system package or kernel feature CI's runners have and cloud agent containers lack; check:pr deselects it",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["smoke.py", "botcube_plotly.py", "tests"]
